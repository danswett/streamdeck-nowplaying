name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the plugin to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build and package
        run: |
          npm run all
          npx streamdeck validate com.bad-duck.nowplaying.sdPlugin --no-update-check
          npx streamdeck pack com.bad-duck.nowplaying.sdPlugin --output dist --force --no-update-check

      - name: Check the tag matches the manifest version
        shell: pwsh
        run: |
          # A tag that disagrees with the manifest would ship a build the
          # release notes do not describe.
          $tag = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''
          $manifest = (Get-Content com.bad-duck.nowplaying.sdPlugin/manifest.json -Raw | ConvertFrom-Json).Version
          Write-Host "tag=$tag manifest=$manifest"
          if (-not $manifest.StartsWith($tag)) {
            throw "tag $tag does not match manifest version $manifest"
          }

      - name: Write the release notes
        shell: pwsh
        run: |
          # Built from the manifest rather than written out here, so a release
          # cannot describe a plugin other than the one attached to it.
          $m = Get-Content com.bad-duck.nowplaying.sdPlugin/manifest.json -Raw | ConvertFrom-Json
          $os = ($m.OS | ForEach-Object { "$($_.Platform) $($_.MinimumVersion)+" }) -join ', '

          @"
          $($m.Description)

          ### Install
          Download ``com.bad-duck.nowplaying.streamDeckPlugin`` below and double-click it.

          Needs a Stream Deck with a dial - this is a touch-strip plugin.

          ### Requires
          - $os
          - Stream Deck $($m.Software.MinimumVersion) or later
          - A player that reports to Windows media controls. Verified with
            Spotify, TIDAL, Plexamp and browser players; Plex HTPC reports
            metadata and artwork but no position.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Attach the plugin to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.streamDeckPlugin
          fail_on_unmatched_files: true
          body_path: release-notes.md
          # Appended below the description: what actually changed, from the
          # commits, without anyone having to keep a changelog by hand.
          generate_release_notes: true
