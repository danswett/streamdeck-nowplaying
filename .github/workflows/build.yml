name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The bridge is a win-x64 self-contained host over SMTC and Core Audio, and
    # the Stream Deck CLI packs on Windows, so there is nothing to gain from a
    # matrix here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # tools/harness.mjs and npm run smoke need a real media session, so the
        # offline suite is what runs here.
        run: npm test

      - name: Build bridge
        # bridge/NuGet.config is git-ignored because it may name an internal
        # proxy; without it the runner restores from the public gallery.
        run: npm run build:bridge

      - name: Build plugin
        run: npm run build

      - name: Validate manifest
        run: npx streamdeck validate com.bad-duck.nowplaying.sdPlugin --no-update-check

      - name: Package
        run: npx streamdeck pack com.bad-duck.nowplaying.sdPlugin --output dist --force --no-update-check

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: com.bad-duck.nowplaying.streamDeckPlugin
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
